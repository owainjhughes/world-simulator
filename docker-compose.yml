services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 12

  genesis-db:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: genesis
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d genesis"]
      interval: 5s
      retries: 12

  clock-db:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: clock
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d clock"]
      interval: 5s
      retries: 12

  genesis:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: arathia:dev
    command: uvicorn app.genesis.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@genesis-db:5432/genesis
      AMQP_URL: amqp://dev:dev@rabbitmq/
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 5s
      retries: 12
    depends_on:
      genesis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  clock:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: arathia:dev
    command: python -m app.clock.main
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@clock-db:5432/clock
      AMQP_URL: amqp://dev:dev@rabbitmq/
      GENESIS_URL: http://genesis:8000
      TICK_SECONDS: "2"
    restart: unless-stopped
    depends_on:
      clock-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      genesis:
        condition: service_healthy
