services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 12

  genesis-db:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: genesis
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d genesis"]
      interval: 5s
      retries: 12

  almanac-db:
    image: postgres:17
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: almanac
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d almanac"]
      interval: 5s
      retries: 12

  genesis:
    build:
      context: .
      dockerfile: services/genesis/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@genesis-db:5432/genesis
      AMQP_URL: amqp://dev:dev@rabbitmq/
    ports:
      - "8000:8000"
    depends_on:
      genesis-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  almanac:
    build:
      context: .
      dockerfile: services/almanac/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@almanac-db:5432/almanac
      AMQP_URL: amqp://dev:dev@rabbitmq/
      GENESIS_URL: http://genesis:8000
      TICK_SECONDS: "2"
    depends_on:
      almanac-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
