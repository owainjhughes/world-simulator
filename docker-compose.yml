services:
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: dev
      RABBITMQ_DEFAULT_PASS: dev
    ports:
      - "18801:5672"
      - "18802:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      retries: 12

  genesis-db:
    image: postgres:17
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: genesis
    ports:
      - "18803:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d genesis"]
      interval: 5s
      retries: 12

  clock-db:
    image: postgres:17
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: clock
    ports:
      - "18804:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d clock"]
      interval: 5s
      retries: 12

  ecology-db:
    image: postgres:17
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ecology
    ports:
      - "18806:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d ecology"]
      interval: 5s
      retries: 12

  genesis:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: arathia:dev
    command: uvicorn app.genesis.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@genesis-db:5432/genesis
    ports:
      - "18800:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 5s
      retries: 12
    depends_on:
      genesis-db:
        condition: service_healthy

  clock:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: arathia:dev
    command: python -m app.clock.main
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@clock-db:5432/clock
      AMQP_URL: amqp://dev:dev@rabbitmq/
      TICK_SECONDS: "2"
    ports:
      - "18805:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 5s
      retries: 12
    depends_on:
      clock-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ecology:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    image: arathia:dev
    command: python -m app.ecology.main
    environment:
      DATABASE_URL: postgresql+asyncpg://dev:dev@ecology-db:5432/ecology
      AMQP_URL: amqp://dev:dev@rabbitmq/
    deploy:
      replicas: 4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 5s
      retries: 12
    depends_on:
      ecology-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  debezium-genesis:
    image: quay.io/debezium/server:3.6.1.Final
    environment:
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: genesis-db
      DEBEZIUM_SOURCE_DATABASE_DBNAME: genesis
      DEBEZIUM_SOURCE_TOPIC_PREFIX: genesis
    volumes:
      - ./deploy/debezium/application.properties:/debezium/config/application.properties:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 5s
      retries: 24
    depends_on:
      genesis:
        condition: service_healthy
      clock:
        condition: service_healthy

  debezium-clock:
    image: quay.io/debezium/server:3.6.1.Final
    environment:
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: clock-db
      DEBEZIUM_SOURCE_DATABASE_DBNAME: clock
      DEBEZIUM_SOURCE_TOPIC_PREFIX: clock
    volumes:
      - ./deploy/debezium/application.properties:/debezium/config/application.properties:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 5s
      retries: 24
    depends_on:
      clock:
        condition: service_healthy

  debezium-ecology:
    image: quay.io/debezium/server:3.6.1.Final
    environment:
      DEBEZIUM_SOURCE_DATABASE_HOSTNAME: ecology-db
      DEBEZIUM_SOURCE_DATABASE_DBNAME: ecology
      DEBEZIUM_SOURCE_TOPIC_PREFIX: ecology
    volumes:
      - ./deploy/debezium/application.properties:/debezium/config/application.properties:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/q/health"]
      interval: 5s
      retries: 24
    depends_on:
      ecology:
        condition: service_healthy
