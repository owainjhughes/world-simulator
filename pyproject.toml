[project]
name = "arathia"
version = "0.2.0"
description = "Distributed ecosystem simulation"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aio-pika>=9.5",
    "httpx>=0.28",
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/domain", "src/infra"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["e2e: needs the docker compose stack running"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
