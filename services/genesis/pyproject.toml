[project]
name = "genesis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "contracts",
    "messaging",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
]

[tool.uv.sources]
contracts = { workspace = true }
messaging = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genesis"]
