[project]
name = "messaging"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["contracts", "aio-pika>=9.5"]

[tool.uv.sources]
contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/messaging"]
