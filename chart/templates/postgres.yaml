{{- range .Values.databases }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ . }}-db
spec:
  serviceName: {{ . }}-db
  replicas: 1
  selector:
    matchLabels:
      app: {{ . }}-db
  template:
    metadata:
      labels:
        app: {{ . }}-db
    spec:
      containers:
        - name: postgres
          image: {{ $.Values.postgres.image }}
          args: ["-c", "wal_level=logical"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: postgres-password
            - name: POSTGRES_DB
              value: {{ . }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $.Values.credentials.postgresUser | quote }}, "-d", {{ . | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $.Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ . }}-db
spec:
  clusterIP: None
  selector:
    app: {{ . }}-db
  ports:
    - port: 5432
      targetPort: postgres
{{- end }}
