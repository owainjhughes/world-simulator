image: arathia:dev

credentials:
  postgresUser: dev
  postgresPassword: dev
  rabbitmqUser: dev
  rabbitmqPassword: dev

rabbitmq:
  image: rabbitmq:4-management
  amqpNodePort: 30567
  managementNodePort: 30672

postgres:
  image: postgres:17
  storage: 1Gi

debezium:
  image: quay.io/debezium/server:3.6.1.Final

databases:
  - genesis
  - clock
  - ecology

services:
  - name: genesis
    replicas: 1
    command: ["uvicorn", "app.genesis.main:app", "--host", "0.0.0.0", "--port", "8000"]
    nodePort: 30080
  - name: clock
    replicas: 1
    command: ["python", "-m", "app.clock.main"]
    nodePort: 30081
    amqp: true
    strategy: Recreate
    env:
      TICK_SECONDS: "2"
  - name: ecology
    replicas: 4
    command: ["python", "-m", "app.ecology.main"]
    amqp: true
