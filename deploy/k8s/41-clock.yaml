apiVersion: apps/v1
kind: Deployment
metadata:
  name: clock
  namespace: ecosystem
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clock
  template:
    metadata:
      labels:
        app: clock
    spec:
      containers:
        - name: clock
          image: arathia:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.clock.main"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: clock-database-url
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: amqp-url
            - name: TICK_SECONDS
              value: "2"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: clock
  namespace: ecosystem
spec:
  type: NodePort
  selector:
    app: clock
  ports:
    - port: 8000
      targetPort: http
      nodePort: 30081
