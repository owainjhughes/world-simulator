apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-ecology
  namespace: ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: debezium-ecology
  template:
    metadata:
      labels:
        app: debezium-ecology
    spec:
      containers:
        - name: debezium
          image: quay.io/debezium/server:3.6.1.Final
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEBEZIUM_SOURCE_DATABASE_HOSTNAME
              value: ecology-db
            - name: DEBEZIUM_SOURCE_DATABASE_DBNAME
              value: ecology
            - name: DEBEZIUM_SOURCE_TOPIC_PREFIX
              value: ecology
            - name: DEBEZIUM_SOURCE_DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: postgres-user
            - name: DEBEZIUM_SOURCE_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: postgres-password
            - name: DEBEZIUM_SINK_RABBITMQ_CONNECTION_USERNAME
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: rabbitmq-user
            - name: DEBEZIUM_SINK_RABBITMQ_CONNECTION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: rabbitmq-password
          volumeMounts:
            - name: config
              mountPath: /debezium/config
          readinessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /q/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: debezium
