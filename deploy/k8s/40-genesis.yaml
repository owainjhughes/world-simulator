apiVersion: apps/v1
kind: Deployment
metadata:
  name: genesis
  namespace: ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genesis
  template:
    metadata:
      labels:
        app: genesis
    spec:
      containers:
        - name: genesis
          image: arathia:dev
          imagePullPolicy: IfNotPresent
          command:
            ["uvicorn", "app.genesis.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: genesis-database-url
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: genesis
  namespace: ecosystem
spec:
  type: NodePort
  selector:
    app: genesis
  ports:
    - port: 8000
      targetPort: http
      nodePort: 30080
